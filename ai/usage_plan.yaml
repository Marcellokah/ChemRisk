goals:
  - "Hatékonyan használom az MI eszközöket a kutatási és fejlesztési feladatok támogatására."
  - "Az MI eszközök használatával időt takarítok meg a dokumentáció és kódolás során."
  - "Interjúkérdés sablonokat és piackutatási összefoglalókat generálok MI segítségével."
operational_cadence:
  check_in: "Hetente kétszer értékelem az MI-eszközök javaslatait."
  review_partner: "A konzulenssel minden sprint végén átbeszélem az MI által generált artefaktumokat."
guardrails:
  - "Személyes azonosítókat és azonosító adatokat nem továbbítok külső MI-eszközöknek."
  - "Minden generált tartalmat a felhasználás előtt manuálisan ellenőrzök."
  - "Érzékeny interjúrészleteket anonimizálok, mielőtt MI-vel elemeztetem őket."
tools:
  - name: "ChatGPT"
    use_cases: ["cikkek összegzése", "interjúkérdések generálása", "szövegek finomhangolása"]
  - name: "GitHub Copilot"
    use_cases: ["kódgenerálás", "kódjavaslatok", "dokumentáció írása"]
