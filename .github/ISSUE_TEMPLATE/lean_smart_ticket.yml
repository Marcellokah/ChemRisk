name: Lean&Smart Ticket
description: Standard ticket template for ChemRisk with AI-friendly prompts
labels: []
title: "[Ticket] "
body:
  - type: input
    id: short_title
    attributes:
      label: Short title
      description: "Clear, concise summary of the issue."
      placeholder: "Example: User cannot save risk scenario"
    validations:
      required: true

  - type: dropdown
    id: type
    attributes:
      label: Type
      description: What sort of ticket is this?
      options:
        - Feature
        - Bug
        - Chore/Infra
        - Research/Spike
        - Idea
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Short description
      description: "1–5 sentences. Why is this issue being raised? Context."
      placeholder: "E.g. The export function throws an error for large files."
    validations:
      required: true

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance criteria
      description: "Bullet points describing when this ticket is 'Done'. Prefill with AI if possible."
      placeholder: |
        - The user can save a risk scenario without error
        - All form data is retained upon save
        - Success message shown
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - High
        - Medium
        - Low
    validations:
      required: true

  - type: dropdown
    id: status
    attributes:
      label: Status
      description: Current stage. (Automated where possible)
      options:
        - Open
        - In Progress
        - In Review
        - Done
        - Blocked
    validations:
      required: true

  - type: input
    id: labels
    attributes:
      label: Extra labels
      description: "Add contextual tags (comma separated). E.g. UI, API, Release"
    validations:
      required: false

  - type: input
    id: assignee
    attributes:
      label: Assignee
      description: "Who owns this ticket? (@username or 'AI')"
    validations:
      required: false

  - type: dropdown
    id: estimate
    attributes:
      label: Estimate
      options:
        - 1
        - 2
        - 4
        - 8
    validations:
      required: false
