name: Lean&Smart Ticket
about: Standard ticket template for ChemRisk with AI-friendly prompts
labels: ''
title: '[Ticket] '
body:
  - type: input
    id: title
    attributes:
      label: Short Title
      description: 'Clear, concise summary of the issue.'
      placeholder: Example: User cannot save risk scenario
      required: true
  - type: dropdown
    id: type
    attributes:
      label: Type
      description: What sort of ticket is this?
      options:
        - Feature
        - Bug
        - Chore/Infra
        - Research/Spike
        - Idea
      required: true
  - type: textarea
    id: description
    attributes:
      label: Short Description
      description: '1-5 sentences. Why is this issue being raised? Context.'
      placeholder: 'E.g., The export function throws an error for large files.'
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      description: 'Bullet points describing when this ticket is "Done". Prefill with AI if possible.'
      placeholder: |
        - The user can save a risk scenario without error
        - All form data is retained upon save
        - Success message shown
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      multiple: false
      options:
        - High
        - Medium
        - Low
      required: true
  - type: dropdown
    id: status
    attributes:
      label: Status
      description: Current stage. (Automated where possible)
      options:
        - Open
        - In Progress
        - In Review
        - Done
        - Blocked
      required: true
  - type: input
    id: labels
    attributes:
      label: Labels
      description: Add contextual tags (comma separated). E.g. UI, API, Release
      required: false
  - type: input
    id: assignee
    attributes:
      label: Assignee
      description: Who owns this ticket? (@username or "AI")
      required: false
  - type: dropdown
    id: estimate
    attributes:
      label: Estimate (optional)
      options:
        - 1
        - 2
        - 4
        - 8
      required: false
