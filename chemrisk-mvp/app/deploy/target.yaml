# deploy/target.yaml
type: nextjs_standalone
build:
  # Telepítés és build (Next.js .next mappát generál)
  command: "npm ci && npm run build"
  artifacts: [".next", "public", "package.json"]
serve:
  # A buildelt verzió futtatása (nem a dev szerver!)
  command: "npm run start"
  base_url: "http://localhost:3000"
smoke:
  path: "/"
  expect_status: 200
iac:
  tool: "terraform"
  dir: "infra/terraform"
  plan_out: "infra/terraform/plan.out"
notes: "Next.js App Router (ADR-0001). Productionhoz a CHEMRISK_DATA_DIR-t egy tartósan csatolt volume-ra kell mutatni, különben a fájl-alapú auth és archívum adatok elveszhetnek újraindításkor."